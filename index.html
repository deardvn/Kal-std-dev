<style>
/* ================= GLASSMORPHISM VARIABLES ================= */
:root {
  --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --card-bg: rgba(255, 255, 255, 0.2);
  --card-border: rgba(255, 255, 255, 0.3);
  --text: #ffffff;
  --input-bg: rgba(255, 255, 255, 0.25);
  --accent: #ffffff;
  --accent-hover: #f0f0f0;
  --success-bg: rgba(46, 204, 113, 0.3);
  --success-text: #2ecc71;
  --danger-bg: rgba(231, 76, 60, 0.3);
  --danger-text: #e74c3c;
}

body.dark {
  --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
  --card-bg: rgba(0, 0, 0, 0.4);
  --card-border: rgba(255, 255, 255, 0.1);
  --text: #e0e0e0;
  --input-bg: rgba(0, 0, 0, 0.3);
  --accent: #74c0fc;
}

*{box-sizing:border-box}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.container {
  width: 100%;
  max-width: 800px;
  padding: 2.5rem;
  border-radius: 24px;
  background: var(--card-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

.topbar { display: flex; justify-content: flex-end; }
.topbar button {
  width: 42px; height: 42px; border: none; border-radius: 50%;
  background: var(--input-bg); color: #fff; cursor: pointer;
  border: 1px solid var(--card-border);
}

h2 { text-align: center; margin-top: 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

.inputs {
  margin-top: 2rem; display: grid; gap: 1rem; justify-content: center;
  grid-template-columns: repeat(auto-fit, 140px); align-items: stretch;
}

input, select {
  height: 48px; border: 1px solid var(--card-border); border-radius: 12px;
  padding: 0 1rem; text-align: center; font-size: 1rem;
  background: var(--input-bg); color: #fff; outline: none;
}
input::placeholder { color: rgba(255,255,255,0.7); }
select option { background: #333; color: #fff; }

.button-container {
  margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; align-items: center;
}

.action-button {
  width: 100%; max-width: 260px; height: 48px; border: none; border-radius: 12px;
  font-weight: bold; background: #fff; color: #4a00e0; cursor: pointer;
  transition: all 0.2s ease;
}
.action-button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

#hasil { margin-top: 2.5rem; display: flex; flex-direction: column; gap: 1rem; }
.result-line {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 1.5rem; border-radius: 12px; background: var(--input-bg);
  border: 1px solid var(--card-border);
}

.status-ok { background: var(--success-bg); color: #2ecc71; font-weight: bold; }
.status-bad { background: var(--danger-bg); color: #e74c3c; font-weight: bold; }

.footer {
  margin-top: 3rem; display: flex; gap: 10px; align-items: center;
  justify-content: center; font-size: 0.85rem; flex-wrap: wrap; color: rgba(255,255,255,0.9);
}
.footer a { color: #fff; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.insta-icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
</style>
  
</head>

<body>

<div class="container">

  <div class="topbar">
    <button onclick="toggleTheme()">🌙</button>
  </div>

  <h2>CEK STANDAR DEVIASI RELATIF</h2>

  <!-- Opsi Pemilihan Skala Project -->
  <div style="text-align: center; margin-top: 1.5rem; margin-bottom: 0.5rem;">
    <label style="font-weight: 600; color: var(--accent); display: block; margin-bottom: 0.5rem;">Pilih Skala Project ZNT</label>
    <select id="skalaProject" onchange="hitung()" style="width: 100%; max-width: 260px; cursor: pointer;">
      <option value="15">Skala 1:2.500 (Max 15%)</option>
      <option value="25" selected>Skala 1:10.000 (Max 25%)</option>
      <option value="30">Skala 1:25.000 (Max 30%)</option>
    </select>
  </div>
  
  <div class="inputs" id="inputs"></div>

  <div class="button-container">
    <button class="action-button" onclick="tambahSampel()">+ Tambah Sampel</button>
    <button class="action-button" onclick="hitung()">Hitung</button>
  </div>

  <div id="hasil"></div>

  <!-- FOOTER TERBARU -->
  <div class="footer">
    <span>&copy; PT Jade Karya Trinusa</span>
    <span>•</span>
    <a href="https://instagram.com/dheadeviana_" target="_blank">
      <svg class="insta-icon" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
      @dheadeviana_
    </a>
    <span>•</span>
    <a href="https://instagram.com/hasanasdllh" target="_blank">
      <svg class="insta-icon" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
      @hasanasdllh
    </a>
  </div>

</div>

<script>
let maxSampel = 15;
let jumlahSampel = 3;
let valuesCache = [];

/* FORMAT */
function formatRupiah(el){
  let v = el.value.replace(/\D/g,'');
  el.value = v ? new Intl.NumberFormat('id-ID').format(v) : '';
}

/* RENDER INPUT */
function renderInputs(){
  const c = document.getElementById("inputs");
  c.innerHTML = "";

  for(let i=0;i<jumlahSampel;i++){
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Sampel " + (i+1);
    input.value = valuesCache[i] || "";

    input.oninput = () => {
      formatRupiah(input);
      valuesCache[i] = input.value;
    };

    c.appendChild(input);
  }
}

/* TAMBAH SAMPEL */
function tambahSampel(){
  if(jumlahSampel >= maxSampel){
    alert("Maksimal 15 sampel");
    return;
  }
  jumlahSampel++;
  renderInputs();
}

/* HITUNG */
function hitung(){
  const values = valuesCache
    .filter(v => v)
    .map(v => parseFloat(v.replace(/\./g,'')));

  const hasil = document.getElementById("hasil");
  hasil.innerHTML = "";

  if(values.length < 3){
    hasil.innerHTML = `
      <div class="result-line status-bad">
        <span>Error</span>
        <strong>Minimal 3 sampel!</strong>
      </div>`;
    return;
  }

  const mean = values.reduce((a,b)=>a+b,0)/values.length;
  const variance = values.reduce((s,v)=>s+Math.pow(v-mean,2),0)/(values.length-1);
  const sd = Math.sqrt(variance);
  const rsd = mean!==0 ? (sd/mean)*100 : 0;

  let maxRsd = parseFloat(document.getElementById("skalaProject").value);

  const status = rsd<=maxRsd ? "status-ok":"status-bad";
  const text = rsd<=maxRsd ? "Mantab":"Tidak Mantab!";

  hasil.innerHTML = `
    <div class="result-line">
      <span>Rata-rata (Mean)</span>
      <strong>${mean.toLocaleString('id-ID')}</strong>
    </div>
    <div class="result-line">
      <span>Standar Deviasi (SD)</span>
      <strong>${sd.toLocaleString('id-ID')}</strong>
    </div>
    <div class="result-line ${status}">
      <span>Relatif Standar Deviasi (RSD)</span>
      <strong>${rsd.toFixed(2)}% (${text})</strong>
    </div>`;
}

/* DARK MODE */
function toggleTheme(){
  document.body.classList.toggle("dark");
  
}

/* INIT */
renderInputs();
</script>

</body>
</html>
