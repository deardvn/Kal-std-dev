<style>
/* ================= CORPORATE PROFESSIONAL THEME ================= */
:root {
  --primary-navy: #0f172a;
  --secondary-blue: #1e3a8a;
  --accent-blue: #2563eb;
  --accent-hover: #1d4ed8;
  --bg-slate: #f8fafc;
  --card-bg: #ffffff;
  --border-color: #cbd5e1;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --success-bg: #f0fdf4;
  --success-border: #bbf7d0;
  --success-text: #166534;
  --danger-bg: #fef2f2;
  --danger-border: #fecaca;
  --danger-text: #991b1b;
}

body.dark {
  --primary-navy: #38bdf8;
  --secondary-blue: #60a5fa;
  --accent-blue: #3b82f6;
  --accent-hover: #2563eb;
  --bg-slate: #0f172a;
  --card-bg: #1e293b;
  --border-color: #334155;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --success-bg: #064e3b;
  --success-border: #047857;
  --success-text: #a7f3d0;
  --danger-bg: #7f1d1d;
  --danger-border: #b91c1c;
  --danger-text: #fecaca;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-slate);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}

.container {
  width: 100%;
  max-width: 800px;
  padding: 2.5rem;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
}

.topbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 0.5rem;
}

.topbar button {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--card-bg);
  cursor: pointer;
  color: var(--text-main);
  transition: all 0.2s ease;
}

.topbar button:hover {
  background: var(--bg-slate);
}

h2 {
  text-align: center;
  margin-top: 0;
  color: var(--secondary-blue);
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  text-transform: uppercase;
}

/* INPUT SECTION */
.inputs {
  margin-top: 1.5rem;
  display: grid;
  gap: 1rem;
  justify-content: center;
  grid-template-columns: repeat(auto-fit, 150px);
  align-items: stretch;
}

input, select {
  height: 44px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 0 0.85rem;
  text-align: center;
  font-size: 0.9rem;
  font-weight: 500;
  background: var(--card-bg);
  color: var(--text-main);
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus, select:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

/* BUTTONS */
.button-container {
  margin-top: 2rem;
  display: flex;
  flex-direction: flex-row;
  gap: 0.75rem;
  justify-content: center;
  flex-wrap: wrap;
}

.action-button {
  min-width: 180px;
  height: 44px;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.9rem;
  background: var(--accent-blue);
  color: #ffffff;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

.action-button:hover {
  background: var(--accent-hover);
}

.action-button:active {
  transform: translateY(1px);
}

/* HASIL */
#hasil {
  margin-top: 2rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.result-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.85rem 1.25rem;
  border-radius: 6px;
  background: var(--bg-slate);
  border: 1px solid var(--border-color);
  font-size: 0.95rem;
}

.result-line strong {
  font-weight: 700;
}

.status-ok {
  background: var(--success-bg);
  border-color: var(--success-border);
  color: var(--success-text);
}

.status-bad {
  background: var(--danger-bg);
  border-color: var(--danger-border);
  color: var(--danger-text);
}

/* FOOTER */
.footer {
  margin-top: 2.5rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border-color);
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  font-size: 0.825rem;
  color: var(--text-muted);
  flex-wrap: wrap;
}

.footer a {
  color: var(--accent-blue);
  text-decoration: none;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.footer a:hover {
  text-decoration: underline;
}

.insta-icon {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}
</style>
  
</head>

<body>

<div class="container">

  <div class="topbar">
    <button onclick="toggleTheme()">🌙</button>
  </div>

  <h2>CEK STANDAR DEVIASI RELATIF</h2>

  <!-- Opsi Pemilihan Skala Project -->
  <div style="text-align: center; margin-top: 1.5rem; margin-bottom: 0.5rem;">
    <label style="font-weight: 600; color: var(--accent); display: block; margin-bottom: 0.5rem;">Pilih Skala Project ZNT</label>
    <select id="skalaProject" onchange="hitung()" style="width: 100%; max-width: 260px; cursor: pointer;">
      <option value="15">Skala 1:2.500 (Max 15%)</option>
      <option value="25" selected>Skala 1:10.000 (Max 25%)</option>
      <option value="30">Skala 1:25.000 (Max 30%)</option>
    </select>
  </div>
  
  <div class="inputs" id="inputs"></div>

  <div class="button-container">
    <button class="action-button" onclick="tambahSampel()">+ Tambah Sampel</button>
    <button class="action-button" onclick="hitung()">Hitung</button>
  </div>

  <div id="hasil"></div>

  <!-- FOOTER TERBARU -->
  <div class="footer">
    <span>&copy; PT Jade Karya Trinusa</span>
    <span>•</span>
    <a href="https://instagram.com/dheadeviana_" target="_blank">
      <svg class="insta-icon" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
      @dheadeviana_
    </a>
    <span>•</span>
    <a href="https://instagram.com/hasanasdllh" target="_blank">
      <svg class="insta-icon" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
      @hasanasdllh
    </a>
  </div>

</div>

<script>
let maxSampel = 15;
let jumlahSampel = 3;
let valuesCache = [];

/* FORMAT */
function formatRupiah(el){
  let v = el.value.replace(/\D/g,'');
  el.value = v ? new Intl.NumberFormat('id-ID').format(v) : '';
}

/* RENDER INPUT */
function renderInputs(){
  const c = document.getElementById("inputs");
  c.innerHTML = "";

  for(let i=0;i<jumlahSampel;i++){
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Sampel " + (i+1);
    input.value = valuesCache[i] || "";

    input.oninput = () => {
      formatRupiah(input);
      valuesCache[i] = input.value;
    };

    c.appendChild(input);
  }
}

/* TAMBAH SAMPEL */
function tambahSampel(){
  if(jumlahSampel >= maxSampel){
    alert("Maksimal 15 sampel");
    return;
  }
  jumlahSampel++;
  renderInputs();
}

/* HITUNG */
function hitung(){
  const values = valuesCache
    .filter(v => v)
    .map(v => parseFloat(v.replace(/\./g,'')));

  const hasil = document.getElementById("hasil");
  hasil.innerHTML = "";

  if(values.length < 3){
    hasil.innerHTML = `
      <div class="result-line status-bad">
        <span>Error</span>
        <strong>Minimal 3 sampel!</strong>
      </div>`;
    return;
  }

  const mean = values.reduce((a,b)=>a+b,0)/values.length;
  const variance = values.reduce((s,v)=>s+Math.pow(v-mean,2),0)/(values.length-1);
  const sd = Math.sqrt(variance);
  const rsd = mean!==0 ? (sd/mean)*100 : 0;

  let maxRsd = parseFloat(document.getElementById("skalaProject").value);

  const status = rsd<=maxRsd ? "status-ok":"status-bad";
  const text = rsd<=maxRsd ? "Mantab":"Tidak Mantab!";

  hasil.innerHTML = `
    <div class="result-line">
      <span>Rata-rata (Mean)</span>
      <strong>${mean.toLocaleString('id-ID')}</strong>
    </div>
    <div class="result-line">
      <span>Standar Deviasi (SD)</span>
      <strong>${sd.toLocaleString('id-ID')}</strong>
    </div>
    <div class="result-line ${status}">
      <span>Relatif Standar Deviasi (RSD)</span>
      <strong>${rsd.toFixed(2)}% (${text})</strong>
    </div>`;
}

/* DARK MODE */
function toggleTheme(){
  document.body.classList.toggle("dark");
  
}

/* INIT */
renderInputs();
</script>

</body>
