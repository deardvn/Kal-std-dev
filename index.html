<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Standar Deviasi Properti</title>
  
  <!-- Open Graph / Meta Social -->
  <meta property="og:title" content="Kalkulator Standar Deviasi Properti">
  <meta property="og:description" content="Alat bantu hitung nilai rata-rata, standar deviasi, dan Koefisien Variasi (KV) untuk analisis data sampel properti.">
  <meta property="og:image" content="og-image.png">
  <meta property="og:type" content="website">

  <!-- Favicon / Icon -->
  <link rel="icon" type="image/png" href="icon.png">
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-slate: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    /* Dark Theme Variables */
    body.dark-mode {
      --bg-slate: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.3s, border-color 0.3s, color 0.3s;
    }

    body {
      background-color: var(--bg-slate);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 28px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .header-actions {
      position: absolute;
      top: 24px;
      right: 24px;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle:hover {
      background-color: var(--bg-slate);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
      padding-right: 80px;
    }

    .project-info {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .input-section {
      margin-bottom: 24px;
    }

    .sample-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .sample-controls label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .select-dropdown {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
    }

    .input-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input-field {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .results-card {
      margin-top: 24px;
      padding: 20px;
      background-color: var(--bg-slate);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: none;
    }

    .results-card.active {
      display: block;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 0.95rem;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-label {
      color: var(--text-muted);
    }

    .result-value {
      font-weight: 700;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-success {
      background-color: var(--success-bg);
      color: var(--success-text);
    }

    .badge-danger {
      background-color: var(--danger-bg);
      color: var(--danger-text);
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">
        <i class="fa-solid fa-moon"></i> Dark
      </button>
    </div>

    <h2>Kalkulator Standar Deviasi</h2>
    <div class="project-info">
      <strong>PT Jade Karya Trinusa</strong>
    </div>

    <div class="input-section">
      <div class="sample-controls">
        <label for="sampleCount">Jumlah Sampel:</label>
        <select id="sampleCount" class="select-dropdown" onchange="renderInputs()">
          <option value="3">3 Sampel</option>
          <option value="4">4 Sampel</option>
          <option value="5" selected>5 Sampel</option>
        </select>
      </div>

      <div class="input-grid" id="inputGrid">
        <!-- Input fields rendered dynamically -->
      </div>

      <button class="btn-submit" onclick="calculateSD()">Hitung Hasil</button>
    </div>

    <div class="results-card" id="resultsCard">
      <div class="result-item">
        <span class="result-label">Rata-rata (Mean):</span>
        <span class="result-value" id="resMean">0</span>
      </div>
      <div class="result-item">
        <span class="result-label">Standar Deviasi (S):</span>
        <span class="result-value" id="resSD">0</span>
      </div>
      <div class="result-item">
        <span class="result-label">Koefisien Variasi (KV):</span>
        <span class="result-value" id="resKV">0%</span>
      </div>
      <div class="result-item" style="margin-top: 8px; align-items: center;">
        <span class="result-label">Status Presisi:</span>
        <span id="resStatus" class="badge badge-success">Sesuai</span>
      </div>
    </div>

    <footer>
      <span>&copy; PT Jade Karya Trinusa</span>
      <span>•</span>
      <a href="https://instagram.com/dheadeviana_" target="_blank"><i class="fa-brands fa-instagram"></i> @dheadeviana_</a>
    </footer>
  </div>

  <script>
    // RENDER INPUT FIELDS
    function renderInputs() {
      const count = parseInt(document.getElementById('sampleCount').value);
      const grid = document.getElementById('inputGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        const div = document.createElement('div');
        div.className = 'input-group';
        div.innerHTML = `
          <label for="sample${i}">Nilai Sampel ${i}:</label>
          <input type="number" id="sample${i}" class="input-field" placeholder="Masukkan angka..." step="any">
        `;
        grid.appendChild(div);
      }
    }

    // CALCULATE MEAN, SD, KV
    function calculateSD() {
      const count = parseInt(document.getElementById('sampleCount').value);
      let values = [];

      for (let i = 1; i <= count; i++) {
        const val = parseFloat(document.getElementById(`sample${i}`).value);
        if (!isNaN(val)) {
          values.push(val);
        }
      }

      if (values.length < 2) {
        alert('Harap isi minimal 2 data sampel yang valid!');
        return;
      }

      // Mean
      const sum = values.reduce((a, b) => a + b, 0);
      const mean = sum / values.length;

      // Standard Deviation (Sample)
      const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (values.length - 1);
      const sd = Math.sqrt(variance);

      // Coefficient of Variation (%)
      const kv = mean !== 0 ? (sd / mean) * 100 : 0;

      // Display Results
      document.getElementById('resMean').innerText = mean.toLocaleString('id-ID', { maximumFractionDigits: 2 });
      document.getElementById('resSD').innerText = sd.toLocaleString('id-ID', { maximumFractionDigits: 2 });
      document.getElementById('resKV').innerText = kv.toFixed(2) + '%';

      const statusBadge = document.getElementById('resStatus');
      if (kv <= 30) {
        statusBadge.innerText = 'Presisi Bagus (KV ≤ 30%)';
        statusBadge.className = 'badge badge-success';
      } else {
        statusBadge.innerText = 'Variasi Tinggi (KV > 30%)';
        statusBadge.className = 'badge badge-danger';
      }

      document.getElementById('resultsCard').classList.add('active');
    }

    // THEME TOGGLE
    function toggleTheme() {
      const body = document.body;
      const btn = document.getElementById('themeToggleBtn');
      body.classList.toggle('dark-mode');

      if (body.classList.contains('dark-mode')) {
        btn.innerHTML = '<i class="fa-solid fa-sun"></i> Light';
      } else {
        btn.innerHTML = '<i class="fa-solid fa-moon"></i> Dark';
      }
    }

    // INITIAL RENDER
    renderInputs();
  </script>
</body>
</html>
