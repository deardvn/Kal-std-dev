<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEK STANDAR DEVIASI RELATIF</title>
  
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #e6ecf5;
      --text-blue: #4d72f8;
      --text-dark: #334155;
      --shadow-light: #ffffff;
      --shadow-dark: #b8c4d8;
      --card-bg: #e6ecf5;
    }

    body.dark-mode {
      --bg-color: #1e293b;
      --text-blue: #60a5fa;
      --text-dark: #f8fafc;
      --shadow-light: #2b3a52;
      --shadow-dark: #111827;
      --card-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.3s ease;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Toggle Dark Mode Button */
    .theme-toggle {
      position: absolute;
      top: 0;
      right: 10px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--bg-color);
      border: none;
      color: #f59e0b;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 6px 6px 12px var(--shadow-dark), 
                  -6px -6px 12px var(--shadow-light);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .theme-toggle:active {
      box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                  inset -4px -4px 8px var(--shadow-light);
    }

    /* Header */
    h1 {
      color: var(--text-blue);
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    .label-blue {
      color: var(--text-blue);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 10px;
      text-align: center;
    }

    /* Neumorphic Input & Select Box */
    .neu-box {
      width: 100%;
      background: var(--bg-color);
      border: none;
      outline: none;
      padding: 14px 20px;
      border-radius: 20px;
      box-shadow: inset 5px 5px 10px var(--shadow-dark), 
                  inset -5px -5px 10px var(--shadow-light);
      color: var(--text-dark);
      font-size: 0.95rem;
      text-align: center;
      font-weight: 600;
    }

    .scale-select-wrapper {
      width: 100%;
      max-width: 320px;
      margin-bottom: 30px;
    }

    /* Grid Sampel Menyamping */
    .samples-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      width: 100%;
      margin-bottom: 25px;
    }

    .sample-item {
      flex: 1 1 150px;
      max-width: 180px;
    }

    .sample-item input {
      width: 100%;
    }

    /* Neumorphic Buttons */
    .neu-btn {
      width: 100%;
      max-width: 260px;
      padding: 14px;
      border-radius: 20px;
      border: none;
      background: var(--bg-color);
      color: var(--text-blue);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 6px 6px 12px var(--shadow-dark), 
                  -6px -6px 12px var(--shadow-light);
      margin-bottom: 15px;
    }

    .neu-btn:active {
      box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                  inset -4px -4px 8px var(--shadow-light);
    }

    /* Card Hasil */
    .results-card {
      width: 100%;
      max-width: 450px;
      margin-top: 20px;
      padding: 20px 25px;
      border-radius: 20px;
      box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                  inset -4px -4px 8px var(--shadow-light);
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .results-card.active {
      display: flex;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .status-badge {
      text-align: center;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .status-pass {
      background: #d1fae5;
      color: #047857;
    }

    .status-fail {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* Footer */
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    footer a {
      color: var(--text-blue);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">
      <i class="fa-solid fa-moon"></i>
    </button>

    <h1>CEK STANDAR DEVIASI RELATIF</h1>

    <div class="scale-select-wrapper">
      <div class="label-blue">Pilih Skala Project ZNT</div>
      <select id="scaleSelect" class="neu-box">
        <option value="25" selected>Skala 1:10.000 (Max 25%)</option>
        <option value="20">Skala 1:2.500 (Max 20%)</option>
        <option value="15">Skala 1:1.000 (Max 15%)</option>
      </select>
    </div>

    <div class="samples-grid" id="samplesGrid">
      <!-- Input Sampel Otomatis -->
    </div>

    <button class="neu-btn" onclick="addSample()">+ Tambah Sampel</button>
    <button class="neu-btn" onclick="calculateSD()">Hitung</button>

    <div class="results-card" id="resultsCard">
      <div class="result-row">
        <span>Rata-rata (Mean):</span>
        <span id="resMean">0</span>
      </div>
      <div class="result-row">
        <span>Standar Deviasi (S):</span>
        <span id="resSD">0</span>
      </div>
      <div class="result-row">
        <span>SDR / KV:</span>
        <span id="resKV">0%</span>
      </div>
      <div id="resStatus" class="status-badge status-pass">MEMENUHI SYARAT</div>
    </div>

    <footer>
      <span>&copy; PT Jade Karya Trinusa</span>
      <span>•</span>
      <a href="https://instagram.com/dheadeviana_" target="_blank"><i class="fa-brands fa-instagram"></i> @dheadeviana_</a>
    </footer>
  </div>

  <script>
    let sampleCount = 3;

    function renderSamples() {
      const grid = document.getElementById('samplesGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= sampleCount; i++) {
        const div = document.createElement('div');
        div.className = 'sample-item';
        div.innerHTML = `
          <input type="number" id="sample${i}" class="neu-box" placeholder="Sampel ${i}" step="any">
        `;
        grid.appendChild(div);
      }
    }

    function addSample() {
      if (sampleCount < 10) {
        sampleCount++;
        renderSamples();
      } else {
        alert('Maksimal 10 sampel!');
      }
    }

    function calculateSD() {
      let values = [];
      for (let i = 1; i <= sampleCount; i++) {
        const val = parseFloat(document.getElementById(`sample${i}`).value);
        if (!isNaN(val)) {
          values.push(val);
        }
      }

      if (values.length < 2) {
        alert('Harap isi minimal 2 data sampel!');
        return;
      }

      const maxKvAllowed = parseFloat(document.getElementById('scaleSelect').value);
      const sum = values.reduce((a, b) => a + b, 0);
      const mean = sum / values.length;
      const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (values.length - 1);
      const sd = Math.sqrt(variance);
      const kv = mean !== 0 ? (sd / mean) * 100 : 0;

      document.getElementById('resMean').innerText = mean.toLocaleString('id-ID', { maximumFractionDigits: 2 });
      document.getElementById('resSD').innerText = sd.toLocaleString('id-ID', { maximumFractionDigits: 2 });
      document.getElementById('resKV').innerText = kv.toFixed(2) + '%';

      const statusBadge = document.getElementById('resStatus');
      if (kv <= maxKvAllowed) {
        statusBadge.innerText = `MEMENUHI SYARAT (≤ ${maxKvAllowed}%)`;
        statusBadge.className = 'status-badge status-pass';
      } else {
        statusBadge.innerText = `TIDAK MEMENUHI SYARAT (> ${maxKvAllowed}%)`;
        statusBadge.className = 'status-badge status-fail';
      }

      document.getElementById('resultsCard').classList.add('active');
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const btn = document.getElementById('themeBtn');
      if (document.body.classList.contains('dark-mode')) {
        btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
      } else {
        btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
      }
    }

    renderSamples();
  </script>
</body>
</html>
