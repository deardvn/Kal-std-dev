<style>
/* ================= CLEAN FLAT VARIABLES ================= */
:root {
  --bg: #f4f6f9;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --accent: #3b82f6;
  --border: #e2e8f0;
  --input-bg: #f8fafc;
}

body.dark {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --text: #f8fafc;
  --accent: #60a5fa;
  --border: #334155;
  --input-bg: #0f172a;
}

*{box-sizing:border-box}

body {
  margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; align-items: center; justify-content: center; padding: 1.5rem;
}

.container {
  width: 100%; max-width: 800px; padding: 2.5rem; border-radius: 16px;
  background: var(--card-bg); border: 1px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}

.topbar { display: flex; justify-content: flex-end; }
.topbar button {
  width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--input-bg); cursor: pointer; color: var(--text);
}

h2 { text-align: center; margin-top: 0; color: var(--accent); font-weight: 700; }

.inputs {
  margin-top: 2rem; display: grid; gap: 1rem; justify-content: center;
  grid-template-columns: repeat(auto-fit, 140px); align-items: stretch;
}

input, select {
  height: 46px; border: 1px solid var(--border); border-radius: 10px;
  padding: 0 1rem; text-align: center; font-size: 0.95rem;
  background: var(--input-bg); color: var(--text); outline: none;
}
input:focus, select:focus { border-color: var(--accent); }

.button-container {
  margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; align-items: center;
}

.action-button {
  width: 100%; max-width: 260px; height: 46px; border: none; border-radius: 10px;
  font-weight: 600; background: var(--accent); color: #fff; cursor: pointer;
  transition: opacity 0.2s;
}
.action-button:hover { opacity: 0.9; }

#hasil { margin-top: 2.5rem; display: flex; flex-direction: column; gap: 0.8rem; }
.result-line {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 1.2rem; border-radius: 10px; background: var(--input-bg);
  border: 1px solid var(--border);
}

.status-ok { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
.status-bad { background: #fee2e2; color: #991b1b; border-color: #fecaca; }

.footer {
  margin-top: 3rem; display: flex; gap: 10px; align-items: center;
  justify-content: center; font-size: 0.85rem; flex-wrap: wrap; opacity: 0.8;
}
.footer a { color: var(--accent); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.insta-icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
</style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <button onclick="toggleTheme()">🌙</button>
  </div>

  <h2>CEK STANDAR DEVIASI RELATIF</h2>

  <!-- Opsi Pemilihan Skala Project -->
  <div style="text-align: center; margin-top: 1.5rem; margin-bottom: 0.5rem;">
    <label style="font-weight: 600; color: var(--accent); display: block; margin-bottom: 0.5rem;">Pilih Skala Project ZNT</label>
    <select id="skalaProject" onchange="hitung()" style="width: 100%; max-width: 260px; cursor: pointer;">
      <option value="15">Skala 1:2.500 (Max 15%)</option>
      <option value="25" selected>Skala 1:10.000 (Max 25%)</option>
      <option value="30">Skala 1:25.000 (Max 30%)</option>
    </select>
  </div>
  
  <div class="inputs" id="inputs"></div>

  <div class="button-container">
    <button class="action-button" onclick="tambahSampel()">+ Tambah Sampel</button>
    <button class="action-button" onclick="hitung()">Hitung</button>
  </div>

  <div id="hasil"></div>

  <!-- FOOTER TERBARU -->
  <div class="footer">
    <span>&copy; PT Jade Karya Trinusa</span>
    <span>•</span>
    <a href="https://instagram.com/dheadeviana_" target="_blank">
      <svg class="insta-icon" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
      @dheadeviana_
    </a>
    <span>•</span>
    <a href="https://instagram.com/hasanasdllh" target="_blank">
      <svg class="insta-icon" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
      @hasanasdllh
    </a>
  </div>

</div>

<script>
let maxSampel = 15;
let jumlahSampel = 3;
let valuesCache = [];

/* FORMAT */
function formatRupiah(el){
  let v = el.value.replace(/\D/g,'');
  el.value = v ? new Intl.NumberFormat('id-ID').format(v) : '';
}

/* RENDER INPUT */
function renderInputs(){
  const c = document.getElementById("inputs");
  c.innerHTML = "";

  for(let i=0;i<jumlahSampel;i++){
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Sampel " + (i+1);
    input.value = valuesCache[i] || "";

    input.oninput = () => {
      formatRupiah(input);
      valuesCache[i] = input.value;
    };

    c.appendChild(input);
  }
}

/* TAMBAH SAMPEL */
function tambahSampel(){
  if(jumlahSampel >= maxSampel){
    alert("Maksimal 15 sampel");
    return;
  }
  jumlahSampel++;
  renderInputs();
}

/* HITUNG */
function hitung(){
  const values = valuesCache
    .filter(v => v)
    .map(v => parseFloat(v.replace(/\./g,'')));

  const hasil = document.getElementById("hasil");
  hasil.innerHTML = "";

  if(values.length < 3){
    hasil.innerHTML = `
      <div class="result-line status-bad">
        <span>Error</span>
        <strong>Minimal 3 sampel!</strong>
      </div>`;
    return;
  }

  const mean = values.reduce((a,b)=>a+b,0)/values.length;
  const variance = values.reduce((s,v)=>s+Math.pow(v-mean,2),0)/(values.length-1);
  const sd = Math.sqrt(variance);
  const rsd = mean!==0 ? (sd/mean)*100 : 0;

  let maxRsd = parseFloat(document.getElementById("skalaProject").value);

  const status = rsd<=maxRsd ? "status-ok":"status-bad";
  const text = rsd<=maxRsd ? "Mantab":"Tidak Mantab!";

  hasil.innerHTML = `
    <div class="result-line">
      <span>Rata-rata (Mean)</span>
      <strong>${mean.toLocaleString('id-ID')}</strong>
    </div>
    <div class="result-line">
      <span>Standar Deviasi (SD)</span>
      <strong>${sd.toLocaleString('id-ID')}</strong>
    </div>
    <div class="result-line ${status}">
      <span>Relatif Standar Deviasi (RSD)</span>
      <strong>${rsd.toFixed(2)}% (${text})</strong>
    </div>`;
}

/* DARK MODE */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* INIT */
renderInputs();
</script>

</body>
</html>
